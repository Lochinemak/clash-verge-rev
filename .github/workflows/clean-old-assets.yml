name: Clean Old Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Rolling release tag to clean'
        required: false
        default: 'alpha'
        type: string
      current_version:
        description: 'Asset version to preserve; latest.json is used when omitted'
        required: false
        type: string
      source_ref:
        description: 'Source ref used only as a final version fallback'
        required: false
        default: 'loch/dev'
        type: string
      dry_run:
        description: 'Dry run mode (only show what would be deleted)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag_name:
        description: 'Rolling release tag to clean'
        required: false
        default: 'alpha'
        type: string
      current_version:
        description: 'Asset version to preserve'
        required: false
        type: string
      source_ref:
        description: 'Exact source ref used only as a version fallback'
        required: false
        default: 'loch/dev'
        type: string
      dry_run:
        description: 'Dry run mode (only show what would be deleted)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  clean_old_assets:
    name: Clean Old Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || 'loch/dev' }}
          fetch-depth: 1

      - name: Resolve version to preserve
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || 'alpha' }}
          REQUESTED_VERSION: ${{ inputs.current_version }}
        run: |
          CURRENT_VERSION="$REQUESTED_VERSION"
          if [ -z "$CURRENT_VERSION" ]; then
            LATEST_JSON_EXISTS=$(gh release view "$TAG_NAME" --json assets \
              -q '.assets[] | select(.name == "latest.json") | .name' 2>/dev/null || true)
            if [ -n "$LATEST_JSON_EXISTS" ]; then
              LATEST_JSON_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/latest.json"
              CURRENT_VERSION=$(curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$LATEST_JSON_URL" | jq -r '.version // empty') || CURRENT_VERSION=""
            fi
          fi
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=$(jq -r '.version' package.json)
            echo "⚠️  No explicit version or latest.json version; falling back to package.json"
          fi
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Preserving assets for version: $CURRENT_VERSION"

      - name: Clean old assets from rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || 'alpha' }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ! gh release view "$TAG_NAME" --json id --jq '.id' >/dev/null 2>&1; then
            echo "❌ Release '$TAG_NAME' not found"
            exit 1
          fi

          mapfile -t ASSETS < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ℹ️  No assets found in release '$TAG_NAME'"
            exit 0
          fi

          DELETE_COUNT=0
          for asset in "${ASSETS[@]}"; do
            if [[ "$asset" == *"$CURRENT_VERSION"* ]] || [ "$asset" = "latest.json" ]; then
              echo "Keeping: $asset"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete: $asset"
            else
              echo "Deleting: $asset"
              gh release delete-asset "$TAG_NAME" "$asset" --yes
            fi
            DELETE_COUNT=$((DELETE_COUNT + 1))
          done

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 Dry run complete; $DELETE_COUNT asset(s) would be deleted"
          else
            echo "✅ Cleanup complete; deleted $DELETE_COUNT old asset(s) from '$TAG_NAME'"
          fi
