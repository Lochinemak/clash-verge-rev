name: Check Commit Needs Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Prerelease channel'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - nightly
      tag_name:
        description: 'Rolling release tag to compare'
        required: false
        default: 'alpha'
        type: string
      source_ref:
        description: 'Source branch or ref'
        required: false
        default: 'loch/dev'
        type: string
      source_sha:
        description: 'Exact source commit; source_ref is used when omitted'
        required: false
        type: string
      force_build:
        description: 'Force build regardless of checks'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      channel:
        description: 'Prerelease channel'
        required: true
        type: string
      tag_name:
        description: 'Rolling release tag to compare'
        required: true
        type: string
      source_ref:
        description: 'Source branch or ref'
        required: true
        type: string
      source_sha:
        description: 'Exact source commit to inspect'
        required: true
        type: string
      force_build:
        description: 'Force build regardless of checks'
        required: false
        default: false
        type: boolean
    outputs:
      should_run:
        description: 'Whether the build should run'
        value: ${{ jobs.check_commit.outputs.should_run }}
      last_tauri_commit:
        description: 'The last commit hash with build-related changes'
        value: ${{ jobs.check_commit.outputs.last_tauri_commit }}
      build_version:
        description: 'The generated prerelease version shared by every build job'
        value: ${{ jobs.check_commit.outputs.build_version }}

permissions:
  contents: read
  actions: read

jobs:
  check_commit:
    name: Check Commit Needs Build
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      last_tauri_commit: ${{ steps.check.outputs.last_tauri_commit }}
      build_version: ${{ steps.check.outputs.build_version }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || inputs.source_ref }}
          fetch-depth: 0

      - name: Check latest build-related commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel || 'alpha' }}
          TAG_NAME: ${{ inputs.tag_name || 'alpha' }}
          SOURCE_REF: ${{ inputs.source_ref || 'loch/dev' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          case "$CHANNEL" in
            alpha|nightly) ;;
            *) echo "❌ Unsupported prerelease channel: $CHANNEL"; exit 1 ;;
          esac

          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [ -n "$SOURCE_SHA" ] && [ "$CHECKED_OUT_SHA" != "$SOURCE_SHA" ]; then
            echo "❌ Checked out $CHECKED_OUT_SHA, expected $SOURCE_SHA"
            exit 1
          fi
          echo "🔎 Inspecting $SOURCE_REF at $CHECKED_OUT_SHA for the $CHANNEL channel"

          chmod +x scripts-workflow/get_latest_tauri_commit.bash
          LAST_TAURI_COMMIT_FULL=$(./scripts-workflow/get_latest_tauri_commit.bash) || LAST_TAURI_COMMIT_FULL="$CHECKED_OUT_SHA"
          LAST_TAURI_COMMIT=$(git rev-parse --short "$LAST_TAURI_COMMIT_FULL")

          CURRENT_VERSION=$(jq -r '.version' package.json)
          CURRENT_BASE_VERSION=$(echo "$CURRENT_VERSION" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          if ! [[ "$CURRENT_BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Cannot derive a stable base version from package.json: $CURRENT_VERSION"
            exit 1
          fi

          TIMESTAMP=$(TZ=Asia/Singapore date +%Y%m%d.t%H%M%S)
          BUILD_VERSION="${CURRENT_BASE_VERSION}-${CHANNEL}.${TIMESTAMP}.${LAST_TAURI_COMMIT}"
          echo "🏷️  Build version: $BUILD_VERSION"
          echo "📝 Last build-related commit: $LAST_TAURI_COMMIT"
          echo "last_tauri_commit=$LAST_TAURI_COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "🚀 Force build requested"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_ID=$(gh release view "$TAG_NAME" --json id -q '.id' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "✅ Rolling release '$TAG_NAME' does not exist; build needed"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_JSON_EXISTS=$(gh release view "$TAG_NAME" --json assets \
            -q '.assets[] | select(.name == "latest.json") | .name' 2>/dev/null || true)
          if [ -z "$LATEST_JSON_EXISTS" ]; then
            echo "✅ latest.json is absent from '$TAG_NAME'; build needed"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_JSON_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/latest.json"
          LATEST_VERSION=$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$LATEST_JSON_URL" | jq -r '.version // empty') || LATEST_VERSION=""
          echo "📦 Published $CHANNEL version: ${LATEST_VERSION:-unavailable}"

          LATEST_COMMIT=$(echo "$LATEST_VERSION" | sed -nE \
            "s/^.*-${CHANNEL}\.[0-9]{8}\.t[0-9]{6}\.([a-f0-9]+)$/\1/p")
          if [ -z "$LATEST_COMMIT" ]; then
            echo "⚠️  Could not read a $CHANNEL commit from latest.json; build needed"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_TAURI_COMMIT" != "$LATEST_COMMIT" ]; then
            echo "✅ Build-related commit changed ($LATEST_COMMIT -> $LAST_TAURI_COMMIT)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  Build-related commit is unchanged ($LAST_TAURI_COMMIT); skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
