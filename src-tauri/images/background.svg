<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="660" height="460" viewBox="0 0 660 460">
  <rect width="660" height="460" fill="#ffffff"/>

  <image x="148" y="28" width="52" height="52" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>
  <text x="215" y="64" fill="#111111" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700">Clash Verge Next</text>

  <path d="M246 158 C287 126 365 126 407 157" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <path d="M397 145 L414 159 L393 163 Z" fill="#111111"/>

  <text x="330" y="310" text-anchor="middle" fill="#252525" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="15">如果提示“已损坏 / 无法打开 / 移到废纸篓”：</text>
  <text x="330" y="333" text-anchor="middle" fill="#252525" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="13">请打开「无法打开应用说明.txt」，或在终端运行：</text>
  <rect x="45" y="343" width="570" height="26" rx="6" fill="#f3f4f6"/>
  <text x="330" y="361" text-anchor="middle" fill="#252525" font-family="Menlo, Monaco, monospace" font-size="10.5">xattr -rd com.apple.quarantine "/Applications/Clash Verge Next.app"</text>

  <text x="330" y="400" text-anchor="middle" fill="#252525" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="17">将图标拖入 Applications 文件夹安装</text>
  <text x="330" y="430" text-anchor="middle" fill="#252525" font-family="Helvetica Neue, Arial, sans-serif" font-size="15">Drag the icon to Applications folder</text>
</svg>
